# Pages CMS — Muzeul Virtual (Harta Muzeelor Scolare)
# Docs: https://pagescms.org/docs/
# Surse editabile: content/obiecte, content/sali, content/raioane
# Artefacte generate (NU se editeaza manual): data/obiecte.json, data/raioane.json, js/data.js, js/raioane.js
# Regenerare: node tools/build-data.js (local) sau automat via .github/workflows/build-data.yml

media:
  - name: images
    label: Imagini muzeu
    input: images
    output: /images
    categories: [image]
    extensions: [jpg, jpeg, png, webp, gif]
    rename: safe

content:
  - name: muzeu
    label: ⚙️ Muzeu — setări
    type: file
    path: data/muzeu.json
    format: json
    fields:
      - name: nume
        label: Nume muzeu
        type: string
        required: true
      - name: subtitlu
        label: Subtitlu
        type: string
      - name: sunet
        label: Sunet arhivă activ implicit
        type: boolean

  - name: texte
    label: 🔤 Textele site-ului
    type: file
    path: data/texte.json
    format: json
    fields:
      - name: pagina_principala
        label: 1. Pagina principală cu hartă
        type: object
        fields:
          - { name: titlu_harta, label: Titlu hartă, type: string }
          - { name: subtitlu_harta, label: Subtitlu hartă, type: string }
          - { name: text_buton_contribuie, label: Text buton contribuire, type: string }
          - { name: mesaj_contribuie, label: Mesaj toast contribuire, type: text }
          - name: template_mesaj_curand
            label: Mesaj „în curând” (șablon)
            type: string
            description: "Variabile: {tip} {nume}"
          - { name: titlu_pagina, label: Titlu pagină (tab browser), type: string }
          - { name: descriere_meta, label: Descriere meta (SEO), type: text }
      - name: navigare
        label: 2. Navigare săli
        type: object
        fields:
          - { name: inapoi_harta, label: Buton înapoi la hartă, type: string }
          - { name: titlu_inapoi, label: Tooltip buton hartă, type: string }
      - name: carusel
        label: 3. Carusel
        type: object
        fields:
          - { name: prefix_fila, label: Prefix etichetă („FILA"), type: string }
          - { name: conector_din, label: Conector („DIN"), type: string }
          - { name: gol_titlu, label: Titlu carusel gol, type: text }
          - { name: gol_subtitlu, label: Subtitlu carusel gol, type: text }
          - { name: gol_contor, label: Contor carusel gol, type: string }
      - name: dosar
        label: 4. Dosar exponat
        type: object
        fields:
          - { name: deschide, label: Buton deschide dosarul, type: string }
          - { name: inchide, label: Buton închide dosarul, type: string }
          - { name: inchide_aria, label: Etichetă accesibilitate închidere, type: string }
          - { name: inchide_titlu, label: Tooltip închidere („Sigilează dosarul"), type: string }
          - { name: fila_anterioara, label: Buton fila anterioară, type: string }
          - { name: fila_urmatoare, label: Buton fila următoare, type: string }
          - { name: mareste, label: Buton mărește dosarul, type: string }
          - { name: revino, label: Buton revino la panoul lateral, type: string }
          - { name: citeste_tot, label: Buton „citește toată descrierea", type: string }
          - { name: arata_putin, label: Buton „arată mai puțin", type: string }
          - { name: et_material, label: Etichetă fișă — material, type: string }
          - { name: et_dimensiuni, label: Etichetă fișă — dimensiuni, type: string }
          - { name: et_autor, label: Etichetă fișă — autor, type: string }
          - { name: et_locatie, label: Etichetă fișă — locație, type: string }
          - { name: valoare_lipsa, label: Valoare când lipsește („-"), type: string }
          - { name: conector_an, label: Conector an („ · Anul "), type: string }
          - { name: prefix_imagine, label: Prefix etichetă imagine, type: string }
          - name: template_caption
            label: Caption imagine mărită (șablon)
            type: string
            description: "Variabile: {titlu} {k} {n}"
          - { name: alt_obiect, label: Text alternativ imagine obiect, type: string }
          - { name: hint_fullscreen, label: Sugestie fullscreen, type: string }
          - { name: alt_marita, label: Text alternativ imagine mărită, type: string }
          - { name: vizor_inchide, label: Vizor — închide imaginea, type: string }
          - { name: vizor_anterioara, label: Vizor — imaginea anterioară, type: string }
          - { name: vizor_urmatoare, label: Vizor — imaginea următoare, type: string }
      - name: panou_sate
        label: 5. Panoul satelor
        type: object
        fields:
          - { name: eticheta_selecteaza, label: Etichetă „selectează satul", type: string }
          - { name: toate_satele, label: Opțiunea „toate satele", type: string }
          - { name: vezi_satele, label: Tooltip „vezi satele raionului", type: string }
          - name: template_schimba_satul
            label: Tooltip schimbare sat (șablon)
            type: string
            description: "Variabilă: {sat}"
          - { name: inchide_lista, label: Tooltip închide lista, type: string }
      - name: cartus_sala
        label: 6. Cartuș sală (#cartus-sala)
        type: object
        fields:
          - { name: eticheta_detalii, label: Etichetă „ⓘ DETALII", type: string }
          - { name: prefix_sala, label: Prefix număr sală („SALA "), type: string }
          - { name: antet_muzeu, label: Antet modal („MUZEUL ȘCOLAR"), type: string }
          - { name: titlu_tipice, label: Titlu „ce obiecte pot fi aici", type: string }
          - { name: titlu_acum, label: Titlu „în sală acum", type: string }
          - { name: text_un_obiect, label: Text un singur obiect, type: string }
          - name: template_mai_multe
            label: Text mai multe obiecte (șablon)
            type: string
            description: "Variabilă: {n}"
          - { name: gol_sala, label: Text sală goală, type: text }
          - { name: adauga_primul, label: Text „adaugă primul obiect", type: text }
      - name: footer
        label: 7. Subsol
        type: object
        fields:
          - { name: nume_implicit, label: Nume muzeu implicit, type: string }
          - { name: sunet_da, label: Etichetă sunet pornit, type: string }
          - { name: sunet_nu, label: Etichetă sunet oprit, type: string }
          - { name: titlu_buton_sunet, label: Tooltip buton sunet, type: string }
          - { name: semnatura, label: Semnătură („arhiva Bou Elena"), type: string }
          - name: template_titlu_pagina
            label: Titlu pagină raion (șablon)
            type: string
            description: "Variabilă: {raion}"
          - name: template_titlu_pagina_sat
            label: Titlu pagină sat (șablon)
            type: string
            description: "Variabile: {sat} {raion}"
      - name: tipuri
        label: 8. Tipuri raion
        type: object
        fields:
          - { name: tip_municipiu, label: Prefix municipiu, type: string }
          - { name: tip_autonomie, label: Prefix autonomie, type: string }
          - { name: tip_raion, label: Prefix raion, type: string }
          - { name: fallback_nume_raion, label: Nume raion implicit, type: string }
      - name: erori
        label: 9. Mesaje eroare
        type: object
        fields:
          - { name: titlu_date, label: Titlu eroare date, type: text }
          - { name: subtitlu_date, label: Subtitlu eroare date, type: text }

  - name: sali
    label: 🏛️ Săli
    type: collection
    path: content/sali
    format: json
    filename: "{fields.id}.json"
    view:
      primary: nume
      fields: [nume, id]
      sort: [nume]
      search: [nume, descriere]
    fields:
      - name: id
        label: ID sală (fix — nu schimba după publicare)
        type: string
        required: true
        pattern:
          regex: "^sala-[a-z-]+$"
          message: "ex: sala-scolii"
      - name: nume
        label: Nume sală
        type: string
        required: true
      - name: icon
        label: Icon (emoji)
        type: string
      - name: perete
        label: Culoare perete (hex)
        type: string
        description: "ex: #2a3a62"
        pattern:
          regex: "^#[0-9a-fA-F]{6}$"
          message: "Format hex: #rrggbb"
      - name: lambriu
        label: Culoare podea / lambriu (hex)
        type: string
        description: "ex: #633917"
        pattern:
          regex: "^#[0-9a-fA-F]{6}$"
          message: "Format hex: #rrggbb"
      - name: descriere
        label: Descriere sală
        type: text
        required: true
      - name: imagine
        label: Imagine sală
        type: image
        options:
          media: images
      - name: obiecte_tipice
        label: Ce obiecte pot fi aici
        type: string
        list: true
      - name: invitatie
        label: Invitație contribuire
        type: text

  - name: raioane
    label: 🗺️ Raioane, municipii și sate
    type: collection
    path: content/raioane
    format: json
    filename: "{fields.id}.json"
    view:
      primary: nume
      fields: [nume, tip, stare]
      sort: [nume]
      search: [nume]
    fields:
      - name: id
        label: ID raion (fix)
        type: string
        required: true
        pattern: "^[a-z0-9-]+$"
      - name: nume
        label: Nume
        type: string
        required: true
      - name: tip
        label: Tip
        type: select
        options:
          values:
            - name: raion
              label: Raion
            - name: municipiu
              label: Municipiu
            - name: autonomie
              label: Autonomie
      - name: stare
        label: Stare pe hartă
        type: select
        options:
          values:
            - name: pilot
              label: Pilot (vizibil, intră în muzeu)
            - name: curand
              label: În curând
      - name: sate
        label: Sate / localități ale raionului
        type: object
        description: "Toate satele raionului curent: vezi lista, adaugă sau șterge. ID-urile se folosesc la câmpul Sat din dosare."
        list:
          collapsible:
            collapsed: true
            summary: "{nume}"
        fields:
          - name: id
            label: ID sat
            type: string
            required: true
            pattern: "^[a-z0-9-]+$"
          - name: nume
            label: Nume sat
            type: string
            required: true

  - name: obiecte
    label: 🏺 Obiecte / exponate
    type: collection
    path: content/obiecte
    format: json
    filename: "{fields.id}.json"
    view:
      primary: titlu
      fields: [titlu, sala, raion, sat]
      sort: [ordine, titlu, sala, raion]
      search: [titlu, descriere_scurta, poveste, donator, sat]
    fields:
      - name: id
        label: ID (unic, fără spații/diacritice)
        type: string
        required: true
        description: "ex: clopotel-arama. Devine nume de fișier și ?obiect=..."
        pattern: "^[a-z0-9-]+$"
      - name: titlu
        label: Titlu
        type: string
        required: true
      - name: ordine
        label: Ordine în muzeu (numărul #0000x)
        type: number
        description: "1 = #00001. Obiectele noi primesc următorul număr liber."
      - name: sala
        label: Sala (toate sălile din muzeu)
        type: reference
        required: true
        description: "Alege sala din lista completă. Săli noi apar automat aici după ce le creezi la 🏛️ Săli."
        options:
          collection: sali
          search: "nume"
          value: "{fields.id}"
          label: "{fields.nume}"
      - name: raion
        label: Raion / municipiu
        type: reference
        required: true
        options:
          collection: raioane
          search: "nume"
          value: "{fields.id}"
          label: "{fields.nume}"
      - name: sat
        label: Sat (gol = tot raionul)
        type: string
        required: false
        description: "PAS 1: alege mai sus raionul. PAS 2: deschide în CMS 🗺️ Raioane → raionul ales și copiază ID-ul satului (ex: truseni). La build se verifică automat că satul există în raion."
        pattern: "^([a-z0-9-]+)?$"
      - name: locatie_fizica
        label: 📍 Locația fizică în muzeu
        type: string
        description: "ex: Sala 2, Vitrina D"
      - name: perioada
        label: Perioada
        type: select
        options:
          values: [Interbelic, Război, Comunism, "Anii 90", "Anii 2000", Contemporan]
      - name: an
        label: An
        type: string
      - name: material
        label: Material
        type: string
      - name: dimensiuni
        label: Dimensiuni
        type: string
      - name: donator
        label: Donator
        type: string
      - name: autor
        label: Autor fișă (cine a scris povestea)
        type: string
      - name: descriere_scurta
        label: Descriere scurtă (carusel)
        type: text
        required: true
        options:
          maxlength: 280
      - name: poveste
        label: Povestea (persoana I, dosar)
        type: text
        required: true
        options:
          minlength: 20
      - name: imagine
        label: Imagine copertă (carusel)
        type: image
        required: true
        description: "Poți păstra URL extern (picsum) sau urca fișier nou în images/."
        options:
          media: images
      - name: imagini
        label: Galerie poze (max 5, prima = coperta)
        type: image
        options:
          media: images
          multiple:
            max: 5
      - name: etichete
        label: Etichete
        type: string
        list: true
      - name: expunere
        label: Expunere
        type: select
        options:
          values:
            - name: rama
              label: Ramă
            - name: soclu
              label: Soclu
      - name: vedeta
        label: ⭐ Vedetă (sună clopotul la deschidere)
        type: boolean

  - name: trasee
    label: 🧭 Trasee de vizitare
    type: file
    path: data/trasee.json
    format: json
    list: true
    fields:
      - name: id
        label: ID traseu
        type: string
        required: true
        pattern: "^[a-z0-9-]+$"
      - name: nume
        label: Nume traseu
        type: string
        required: true
      - name: obiecte
        label: Obiecte din traseu (ID-uri)
        type: string
        list: true

  - name: quiz
    label: ❓ Quiz
    type: file
    path: data/quiz.json
    format: json
    list: true
    fields:
      - name: intrebare
        label: Întrebare
        type: string
        required: true
      - name: optiuni
        label: Opțiuni
        type: string
        list: true
      - name: corect
        label: Index răspuns corect (0, 1, 2…)
        type: number
      - name: obiectId
        label: Obiect legat (ID)
        type: string
